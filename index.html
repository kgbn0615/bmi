<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI 계산기</title>
</head>
<body>

  <div class="app-wrapper">
    <!-- 1. 입력 영역 (유리 질감 스타일) -->
    <div class="input-panel">
      <h1>BMI Calculator</h1>
      <div class="input-group"> 
        <label for="height">키 (cm)</label>
        <input type="number" id="height" placeholder="예: 170">
      </div>
      <div class="input-group"> 
        <label for="weight">몸무게 (kg)</label>
        <input type="number" id="weight" placeholder="예: 70">
      </div>
      <button class="btn-calc" onclick="calculateBMI()">내 결과 확인하기</button>
    </div>

    <!-- 2. 결과 대시보드 영역 (독창적인 원형 + 2x2 그리드 UI) -->
    <div id="result-dashboard" class="result-dashboard hidden">
      
      <!-- 상단: 대형 원형 점수판 -->
      <div class="score-display">
        <p class="subtitle">나의 체질량 지수</p>
        <div class="circle-container">
          <div class="circle-inner">
            <span id="bmi-score">00.00</span>
          </div>
        </div>
        <!-- 최종 상태 뱃지 (예: 정상, 비만 등) -->
        <div id="status-badge" class="status-badge">상태</div>
      </div>

      <!-- 하단: 2x2 모듈형 상태 그리드 -->
      <div class="status-grid">
        <div class="grid-item" id="grid-under">
          <span class="icon">🔵</span>
          <div class="info">
            <h4>저체중</h4>
            <p>18.5 미만</p>
          </div>
        </div>
        <div class="grid-item" id="grid-normal">
          <span class="icon">🟢</span>
          <div class="info">
            <h4>정상</h4>
            <p>18.5 ~ 22.9</p>
          </div>
        </div>
        <div class="grid-item" id="grid-over">
          <span class="icon">🟡</span>
          <div class="info">
            <h4>비만 전단계</h4>
            <p>23.0 ~ 24.9</p>
          </div>
        </div>
        <div class="grid-item" id="grid-obese">
          <span class="icon">🔴</span>
          <div class="info">
            <h4>비만</h4>
            <p>25.0 이상</p>
          </div>
        </div>
      </div>
      
    </div>
  </div>
      
  <script src="./script.js"></script>
</body>
</html>
